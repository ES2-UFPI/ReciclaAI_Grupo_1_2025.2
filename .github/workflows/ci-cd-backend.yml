name: CI - Backend Build, Tests & Deploy (Render)

on:
  push:
    branches: [ main, dev]  # inclui branch de deploy
    paths:
      - 'backend/**'                                         # apenas alterações dentro da pasta backend
      - '.github/workflows/ci-cd-backend.yml'                # e o próprio workflow
  pull_request:
    branches: [ main, dev]
    paths:
      - 'backend/**'
      - '.github/workflows/ci-cd-backend.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Cache Maven local repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-${{ hashFiles('backend/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-m2-

      - name: Build and run tests (Maven)
        run: mvn -B -ntp clean verify

      - name: Archive build artefact (jar)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: backend/target/*.jar

      - name: Publish test report (show summary in the check run)
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Unit Tests
          path: backend/target/surefire-reports/*.xml
          reporter: java-junit

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev') && needs.build.result == 'success'

    steps:
      - name: Trigger Render Docker deploy
        env:
          DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          echo "Triggering Render Docker deploy..."
          curl -X POST "$DEPLOY_HOOK" --fail --show-error
